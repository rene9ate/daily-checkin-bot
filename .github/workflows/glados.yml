name: glados

# New workflow runs cancel any still-running run for the same ref (latest wins).
# Uncomment push below if you want check-in on every push to main.
on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
  # push:
  #   branches: [ main ]

concurrency:
  group: glados-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add random delay (0-30 seconds)
        run: |
          delay=$((RANDOM % 31))
          echo "Waiting for ${delay}s"
          sleep "$delay"

      - uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: glados/requirements.txt

      - name: Install requirements
        run: pip install -r ./glados/requirements.txt

      - name: Run checkin
        run: python ./glados/main.py --cookie_string "${{ secrets.GLADOS_COOKIE }}"
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          BARK_DEVICEKEY: ${{ secrets.BARK_DEVICEKEY }}
