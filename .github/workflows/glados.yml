name: glados

permissions:
  contents: read

# concurrency: newer runs cancel in-flight runs on the same ref (latest wins).
on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "glados/**"
      - ".github/workflows/glados.yml"

concurrency:
  group: glados-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Add random delay (0-30 seconds)
        run: |
          delay=$((RANDOM % 31))
          echo "Waiting for ${delay}s"
          sleep "$delay"

      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
        with:
          install-chromedriver: false

      # Pip cache; upstream post step is post-if: success() so failed jobs skip cache save.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: glados/requirements.txt

      - name: Install requirements
        run: pip install -r ./glados/requirements.txt

      - name: Run checkin
        run: python ./glados/main.py --cookie_string "${{ secrets.GLADOS_COOKIE }}"
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          BARK_DEVICEKEY: ${{ secrets.BARK_DEVICEKEY }}
